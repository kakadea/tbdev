<VirtualHost *:80>
    ServerName tbdev-lab.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <DirectoryMatch "^/var/www/html/(include|install|SQL|logs|cache|scripts)(/|$)">
        Require all denied
    </DirectoryMatch>

    Alias /bitbucket/ /var/lib/tbdev/uploads/
    <Directory /var/lib/tbdev/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\\.(php|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <FilesMatch "\.(env|ini|log|sql|bak|old|dist|example)$">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
